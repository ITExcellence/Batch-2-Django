{% extends "blog/base.html" %} 

{% block content %}

 <h1>Welcome to BeginnerBlog</h1>
 <p>Learning Django one step at a time.</p>

 {% for post in posts %}

    <article>

        <h3>{{ post.title }}</h3>
        <p>{{ post.content }}</p>
        <p>
            Created: {{ post.created_at }}
        </p>

    </article>

{% endfor %}

 
{% endblock %}
